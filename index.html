<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#210d17">
<title>Jessica’s Closet — Jogo de Moda</title>
<style>
:root{--wine:#210d17;--pink:#f04e9b;--mint:#43d5a0;--cream:#fff8f4;--ink:#271720;--muted:#8f7d86}
*{box-sizing:border-box}body{margin:0;background:#f4eee9;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button{font:inherit;cursor:pointer;border:0}
.app{max-width:1100px;margin:auto;min-height:100dvh;background:#fff;box-shadow:0 0 40px #30152418}
.topbar{height:64px;background:var(--wine);color:white;display:flex;align-items:center;justify-content:space-between;padding:0 18px;gap:10px}
.brand{font-weight:900;letter-spacing:.5px;font-size:17px}.brand span{color:#ff8dc5}
.stats{display:flex;gap:8px;align-items:center;font-weight:800;font-size:12px}.stat{background:#3b1b2a;border-radius:20px;padding:8px 10px;white-space:nowrap}
.main{display:grid;grid-template-columns:minmax(0,1fr) 330px;min-height:calc(100dvh - 64px)}
.stage{position:relative;min-height:680px;overflow:hidden;background:radial-gradient(ellipse at 48% 35%,#fff 0,#fff9f4 42%,#e8d9d0 100%)}
.stage:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#fff8f1 0%,transparent 15%,transparent 85%,#fff8f1 100%);pointer-events:none}
.glow{position:absolute;width:280px;height:450px;left:50%;top:100px;transform:translateX(-50%);background:#fff9;filter:blur(30px);border-radius:50%}
.floor{position:absolute;bottom:0;height:20%;width:100%;background:linear-gradient(#f8eee7,#e4d2c8);clip-path:polygon(0 30%,100% 0,100% 100%,0 100%)}
.model-wrap{position:absolute;left:50%;bottom:55px;transform:translateX(-50%);height:min(72%,590px);width:min(76%,360px);display:flex;align-items:flex-end;justify-content:center}
.model{position:relative;width:100%;height:100%;filter:drop-shadow(0 14px 10px #54302b25)}
.hair-back{position:absolute;z-index:1;top:3%;left:24%;width:52%;height:28%;background:radial-gradient(ellipse at 40% 20%,#6b3b2e,#28151a 72%);border-radius:48% 48% 44% 44%;box-shadow:-13px 10px 0 -4px #4a2724,14px 13px 0 -3px #392023}
.head{position:absolute;z-index:3;top:6%;left:34%;width:32%;height:17%;background:linear-gradient(90deg,#8b4d3b,#c98266 45%,#a9614c);border-radius:46% 46% 43% 43%;box-shadow:inset 6px 0 8px #6f3a32aa}
.ear{position:absolute;top:52%;width:13%;height:20%;background:#b9725c;border-radius:50%}.ear.left{left:-8%}.ear.right{right:-8%}
.hair-front{position:absolute;z-index:4;top:4%;left:31%;width:38%;height:11%;background:radial-gradient(ellipse at 40% 80%,#593026,#2b171a);border-radius:60% 60% 20% 20%;transform:rotate(-2deg)}
.eye{position:absolute;top:43%;width:18%;height:7%;background:#fff;border-radius:50%}.eye:after{content:"";position:absolute;width:35%;height:90%;left:33%;background:#38201d;border-radius:50%}.eye.left{left:17%}.eye.right{right:17%}
.brow{position:absolute;top:37%;width:23%;height:3px;background:#442520;border-radius:50%}.brow.left{left:12%}.brow.right{right:12%}
.nose{position:absolute;left:46%;top:48%;width:8%;height:18%;border-right:2px solid #8e4e40;border-radius:0 0 8px 0}
.lips{position:absolute;top:70%;left:37%;width:26%;height:8%;background:#8e293c;border-radius:40% 40% 55% 55%;clip-path:polygon(0 30%,30% 0,50% 18%,72% 0,100% 30%,85% 78%,50% 100%,15% 78%)}
.neck{position:absolute;z-index:2;top:20%;left:43%;width:14%;height:9%;background:#ad6a55}
.arms{position:absolute;z-index:3;top:30%;left:18%;width:64%;height:38%;border-left:19px solid #b9735c;border-right:19px solid #c17b62;border-radius:30px;transform:rotate(1deg);opacity:.96}
.torso{position:absolute;z-index:5;top:25%;left:27%;width:46%;height:33%;background:var(--top,#fff);clip-path:polygon(25% 0,75% 0,100% 23%,82% 100%,18% 100%,0 23%);border-radius:10px;box-shadow:inset 0 0 0 2px #ffffff66}
.waist{position:absolute;z-index:6;top:51%;left:31%;width:38%;height:5%;background:var(--belt,#d7b56f);border-radius:5px}
.bottom{position:absolute;z-index:5;top:55%;left:29%;width:42%;height:32%;background:var(--bottom,#22212a);clip-path:polygon(0 0,100% 0,88% 100%,55% 100%,50% 35%,43% 100%,12% 100%);border-radius:4px}
.legs{position:absolute;z-index:2;top:80%;left:35%;width:30%;height:17%;background:linear-gradient(90deg,#995742,#c27c62,#a35e4c);clip-path:polygon(0 0,45% 0,43% 100%,16% 100%,20% 30%,0 100%,0 100%)}
.legs:after{content:"";position:absolute;left:50%;top:0;width:48%;height:100%;background:linear-gradient(90deg,#a65f4b,#ca8468);clip-path:polygon(0 0,100% 0,100% 100%,60% 100%,52% 30%,35% 100%,0 100%)}
.shoes{position:absolute;z-index:7;bottom:0;left:25%;width:50%;height:5%;display:flex;justify-content:space-between}.shoes:before,.shoes:after{content:"";width:42%;height:100%;background:var(--shoe,#fff);border-radius:10px 10px 5px 5px;box-shadow:0 2px 2px #3333}
.accessory{position:absolute;z-index:8;right:8%;top:51%;font-size:36px;filter:drop-shadow(0 3px 2px #0002)}
.look-label{position:absolute;left:18px;bottom:16px;color:#6f5b62;font-size:11px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase}
.floating{position:absolute;top:18px;left:18px;background:#fffdf8e8;border:1px solid #f0e2e7;padding:10px 13px;border-radius:14px;font-size:12px;font-weight:800}
.panel{background:#fff;border-left:1px solid #eee4e8;display:flex;flex-direction:column;min-width:0}
.panel-head{padding:20px 18px 12px}.eyebrow{font-size:10px;letter-spacing:1.7px;color:#d63f8b;font-weight:900;text-transform:uppercase}.panel h1{font-size:23px;margin:5px 0 6px;letter-spacing:-.7px}.sub{font-size:12px;color:var(--muted);line-height:1.5}
.categories{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:0 14px 13px}
.cat{border:1px solid #eee2e7;background:#fbf8f7;border-radius:12px;padding:10px 3px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;color:#6d5961;font-size:10px;font-weight:800}
.cat .ico{font-size:21px}.cat.active{background:#fff0f7;border:2px solid #f04e9b;color:#b6256a;padding:9px 2px 7px}
.wardrobe-title{display:flex;justify-content:space-between;align-items:center;padding:3px 18px 10px;font-weight:900;font-size:13px}.wardrobe-title small{font-weight:600;color:#a28e97}
.items{padding:0 14px 14px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;overflow:auto;max-height:390px}
.item{background:#f8f4f3;border:1px solid #eee6e6;border-radius:13px;min-height:100px;padding:9px 5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#5a444d;font-size:11px;font-weight:800;text-align:center}
.item .swatch{width:42px;height:43px;border-radius:13px;display:grid;place-items:center;font-size:27px;background:linear-gradient(145deg,#fff,#eee2e4);box-shadow:inset 0 0 0 1px #fff}
.item.selected{border:2px solid var(--mint);background:#f0fff8;padding:8px 4px}.item.selected:after{content:"✓";position:absolute}
.item:active{transform:scale(.97)}
.actions{margin-top:auto;padding:13px 15px 18px;border-top:1px solid #f0e7e9;background:#fff;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.primary,.secondary{padding:14px 8px;border-radius:24px;font-weight:900;font-size:12px;letter-spacing:.4px}
.primary{background:linear-gradient(110deg,#30d7a1,#0ebc9d);color:#fff;box-shadow:0 4px 0 #0aa985}
.secondary{background:#f7edf2;color:#8f315f}
.toast{position:absolute;left:50%;bottom:65px;transform:translateX(-50%);background:#27111c;color:#fff;padding:12px 17px;border-radius:24px;font-size:12px;font-weight:800;white-space:nowrap;opacity:0;transition:.25s;pointer-events:none}.toast.show{opacity:1;bottom:80px}
@media(max-width:720px){.topbar{height:58px;padding:0 12px}.brand{font-size:14px}.stats{gap:4px;font-size:10px}.stat{padding:7px 8px}.main{grid-template-columns:1fr;grid-template-rows:minmax(430px,58dvh) auto}.stage{min-height:430px}.model-wrap{height:78%;width:min(78%,310px);bottom:36px}.panel{border-left:0;border-top:1px solid #eee4e8}.panel-head{padding:15px 16px 10px}.panel h1{font-size:21px}.categories{grid-template-columns:repeat(7,minmax(0,1fr));padding:0 10px 11px;gap:5px}.cat{padding:8px 1px 7px;font-size:9px;border-radius:10px}.cat .ico{font-size:18px}.cat.active{padding:7px 0 6px}.items{grid-template-columns:repeat(3,minmax(0,1fr));max-height:none;padding:0 10px 12px}.item{min-height:88px}.actions{position:sticky;bottom:0;padding-bottom:max(14px,env(safe-area-inset-bottom))}.look-label{bottom:10px}.floating{top:12px;left:12px}}
</style>
</head>
<body>
<div class="app">
<header class="topbar"><div class="brand">JESSICA’S <span>CLOSET</span></div><div class="stats"><div class="stat">🏆 <span id="score">100</span></div><div class="stat">💵 5.000</div><div class="stat">💎 300</div></div></header>
<main class="main">
<section class="stage" id="stage">
<div class="glow"></div><div class="floor"></div><div class="floating">✨ LOOK DO DIA</div>
<div class="model-wrap"><div class="model" id="model">
<div class="hair-back"></div><div class="legs"></div><div class="neck"></div>
<div class="head"><span class="ear left"></span><span class="ear right"></span><span class="brow left"></span><span class="brow right"></span><span class="eye left"></span><span class="eye right"></span><span class="nose"></span><span class="lips"></span></div>
<div class="hair-front"></div><div class="arms"></div><div class="torso" id="torso"></div><div class="waist"></div><div class="bottom" id="bottom"></div><div class="shoes"></div><div class="accessory" id="accessory">👜</div>
</div></div>
<div class="look-label" id="lookLabel">Influencer chic · look 01</div><div class="toast" id="toast">Look salvo! 💖</div>
</section>
<aside class="panel">
<div class="panel-head"><div class="eyebrow">Seu momento fashion</div><h1>Monte seu look</h1><div class="sub">Misture tendências, escolha seus favoritos e crie um visual digno de blogueira.</div></div>
<nav class="categories" id="categories">
<button class="cat active" data-cat="tops"><span class="ico">👚</span>Blusas</button>
<button class="cat" data-cat="bottoms"><span class="ico">👖</span>Partes de baixo</button>
<button class="cat" data-cat="dresses"><span class="ico">👗</span>Vestidos</button>
<button class="cat" data-cat="shoes"><span class="ico">👠</span>Sapatos</button>
<button class="cat" data-cat="bags"><span class="ico">👜</span>Bolsas</button>
<button class="cat" data-cat="jewelry"><span class="ico">💎</span>Joias</button>
<button class="cat" data-cat="hair"><span class="ico">💇🏽‍♀️</span>Cabelo</button>
</nav>
<div class="wardrobe-title"><span id="wardrobeTitle">Blusas tendência</span><small id="count">6 opções</small></div>
<div class="items" id="items"></div>
<div class="actions"><button class="secondary" id="random">🎲 Look surpresa</button><button class="primary" id="submit">✓ Finalizar look</button></div>
</aside>
</main>
</div>
<script>
const data={
tops:{title:"Blusas tendência",items:[
["🤍","Cropped branco","#fff","#22212a"],["🖤","Top básico","#24222a","#22212a"],["🎀","Blusa rosa","#f4a5c7","#22212a"],["✨","Body acetinado","#e8d8c8","#22212a"],["🧥","Blazer chic","#d7c3b5","#22212a"],["🩵","Camisa azul","#a9d6e9","#22212a"]]},
bottoms:{title:"Partes de baixo",items:[
["👖","Jeans wide leg","#fff","#6385a5"],["🖤","Saia preta","#fff","#29232c"],["🤎","Calça alfaiataria","#fff","#9a7965"],["🩷","Mini saia rosa","#fff","#e9a3c4"],["🩵","Jeans claro","#fff","#a8c5d9"],["🌿","Calça cargo","#fff","#75836a"]]},
dresses:{title:"Vestidos de blogueira",items:[
["🤍","Vestido clean","#fff","#fff"],["🌹","Vestido vermelho","#fff","#a82f49"],["🖤","Vestido noite","#fff","#24212a"],["🎀","Vestido romântico","#fff","#efb6cd"],["✨","Vestido dourado","#fff","#c9a66b"],["💜","Vestido lilás","#fff","#b7a0d8"]]},
shoes:{title:"Sapatos favoritos",items:[
["👟","Tênis branco","#fff","#22212a"],["👠","Salto nude","#fff","#d9b6a4"],["🥾","Bota preta","#fff","#25232a"],["🩰","Sapatilha","#fff","#e5b4c4"],["👡","Sandália dourada","#fff","#c8a66a"],["👢","Bota fashion","#fff","#795548"]]},
bags:{title:"Bolsas & it bags",items:[
["👜","Bolsa nude","#fff","#d9b9a5"],["🖤","Mini bag preta","#fff","#24212a"],["🎀","Bolsa rosa","#fff","#e9a0c0"],["🤎","Bolsa caramelo","#fff","#9a6246"],["✨","Bolsa dourada","#fff","#c7a45f"],["🩵","Bolsa azul bebê","#fff","#a5d3e4"]]},
jewelry:{title:"Acessórios & joias",items:[
["💎","Brincos brilho","#fff","#22212a"],["📿","Colar delicado","#fff","#c9a66b"],["🕶️","Óculos fashion","#fff","#22212a"],["⌚","Relógio dourado","#fff","#c6a25d"],["🎀","Laço romântico","#fff","#e9a0c0"],["✨","Mix de anéis","#fff","#d3b16b"]]},
hair:{title:"Cabelo de influencer",items:[
["👩🏽‍🦱","Cachos definidos","#fff","#22212a"],["💁🏻‍♀️","Liso polido","#fff","#22212a"],["👱🏼‍♀️","Loiro iluminado","#fff","#22212a"],["👩🏻‍🦰","Ruivo chocolate","#fff","#22212a"],["🎀","Coque com laço","#fff","#22212a"],["💇🏽‍♀️","Ondas glam","#fff","#22212a"]]}
};
let active="tops", chosen={tops:0,bottoms:0,dresses:-1,shoes:0,bags:0,jewelry:0,hair:0},look=1;
function render(){
 const section=data[active];document.getElementById("wardrobeTitle").textContent=section.title;document.getElementById("count").textContent=section.items.length+" opções";
 document.getElementById("items").innerHTML=section.items.map((it,i)=>`<button class="item ${chosen[active]===i?'selected':''}" data-i="${i}"><span class="swatch">${it[0]}</span><span>${it[1]}</span></button>`).join("");
 document.querySelectorAll(".cat").forEach(b=>b.classList.toggle("active",b.dataset.cat===active));
 document.querySelectorAll(".item").forEach(b=>b.addEventListener("click",()=>select(+b.dataset.i)));
}
function select(i){
 chosen[active]=i;let it=data[active].items[i];
 if(active==="tops"){document.getElementById("torso").style.setProperty("--top",it[2]);document.getElementById("bottom").style.setProperty("--bottom",it[3]);}
 if(active==="bottoms"){document.getElementById("bottom").style.setProperty("--bottom",it[3]);document.getElementById("torso").style.setProperty("--top",it[2]);}
 if(active==="dresses"){document.getElementById("torso").style.setProperty("--top",it[3]);document.getElementById("bottom").style.setProperty("--bottom",it[3]);}
 if(active==="shoes")document.querySelector(".shoes").style.setProperty("--shoe",it[3]);
 if(active==="bags"||active==="jewelry")document.getElementById("accessory").textContent=it[0];
 if(active==="hair"){document.querySelector(".hair-back").style.background=({0:"radial-gradient(ellipse at 40% 20%,#6b3b2e,#28151a 72%)",1:"linear-gradient(90deg,#4a3026,#171214)",2:"linear-gradient(90deg,#e8c18a,#b78a55)",3:"linear-gradient(90deg,#8c4b35,#4b241e)",4:"linear-gradient(90deg,#6b3b2e,#28151a)",5:"radial-gradient(ellipse at 40% 20%,#6b3b2e,#28151a 72%)"})[i];}
 render();
}
document.querySelectorAll(".cat").forEach(b=>b.addEventListener("click",()=>{active=b.dataset.cat;render()}));
document.getElementById("random").addEventListener("click",()=>{Object.keys(data).forEach(k=>chosen[k]=Math.floor(Math.random()*data[k].items.length));active="tops";select(chosen.tops);["bottoms","dresses","shoes","bags","jewelry","hair"].forEach(k=>{active=k;select(chosen[k])});active="tops";render();document.getElementById("lookLabel").textContent="Influencer chic · look "+String(++look).padStart(2,"0");showToast("Look surpresa criado! ✨")});
document.getElementById("submit").addEventListener("click",()=>{document.getElementById("score").textContent=100+look*25;document.getElementById("lookLabel").textContent="Look finalizado · look "+String(look).padStart(2,"0");showToast("Arrasou, blogueira! Look finalizado 💖");look++});
function showToast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2100)}
render();
</script>
</body></html>
